<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduSight Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #1d1d1f;
      }
      main {
        width: min(90vw, 420px);
        padding: 24px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 18px 45px rgba(29, 29, 31, 0.12);
      }
      p {
        color: #6e6e73;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline mode</h1>
      <p>EduSight cannot reach the network right now. Cached pages remain available, and queued school updates can sync when connectivity returns.</p>
    </main>
  </body>
</html>
