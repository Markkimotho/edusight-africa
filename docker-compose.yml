services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: edusight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: edusight
      POSTGRES_USER: edusight
      POSTGRES_PASSWORD: edusight
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusight -d edusight"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: edusight_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edusight_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://edusight:edusight@postgres:5432/edusight
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-min-32-characters-long}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY:-change-refresh-secret-in-production-min-32}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: ${COMPOSE_ENVIRONMENT:-development}
      DEBUG: ${COMPOSE_DEBUG:-false}
      SEED_DEMO_DATA: ${COMPOSE_SEED_DEMO_DATA:-true}
      ML_ENABLE_TRAINED_MODEL: ${COMPOSE_ML_ENABLE_TRAINED_MODEL:-false}
      ML_MODEL_PATH: ${COMPOSE_ML_MODEL_PATH:-/app/ml/models/xgb_model.pkl}
      ML_SCALER_PATH: ${COMPOSE_ML_SCALER_PATH:-/app/ml/models/scaler.pkl}
      ML_METADATA_PATH: ${COMPOSE_ML_METADATA_PATH:-/app/ml/models/model_metadata.json}
      PARTNER_API_KEYS: ${PARTNER_API_KEYS:-}
    volumes:
      - ./backend:/app
      - ./ml:/app/ml

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edusight_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - backend
    environment:
      INTERNAL_API_URL: ${COMPOSE_INTERNAL_API_URL:-http://backend:8000}
      NEXT_PUBLIC_API_URL: ${COMPOSE_NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8000}}
      NEXTAUTH_URL: ${COMPOSE_NEXTAUTH_URL:-http://localhost:${FRONTEND_PORT:-3001}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-nextauth-secret-in-production}
      NEXT_TELEMETRY_DISABLED: 1

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
